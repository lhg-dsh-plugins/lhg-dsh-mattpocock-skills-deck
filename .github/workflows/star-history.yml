name: Star History
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
# 同一时间只允许一个更新任务在跑：两个任务同时改同一批文件会互相覆盖，也会把 push 撞成非快进。
concurrency:
  group: star-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 第三方步骤统一固定到提交哈希：井号后面的版本只给人看，实际跑的是前面的哈希。标签会被覆盖，哈希不会；以后升级走 Dependabot 的更新请求，不要手工改回标签。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 仓库脚本是 .mts，Node 20 不认识这个扩展名（ERR_UNKNOWN_FILE_EXTENSION）；Node 22.18 起才默认剥类型。
          # 这个下限跟根 package.json 的 engines 对齐，别再退回 20。
          node-version: 22
      - name: Fetch star history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="FeatherHunter/dsh-mattpocock-skills-deck"
          # 先尝试拉 stargazers 列表（带时间戳，可精确到天）。
          # 2026-10-30 起该接口持续失败（GITHUB_TOKEN 拿 403、个人 token 拿 404），
          # 此时降级：用仓库元数据的 stargazers_count 作为当日总数继续更新。
          # 代价是丢掉按天时间戳粒度（daily 退化成与上次落盘数的差值），但图表不断更。
          if gh api -H "Accept: application/vnd.github.star+json" "repos/$REPO/stargazers" --paginate --jq ".[].starred_at" > /tmp/stars.txt 2>/tmp/stars.err; then
            MODE=list
          else
            echo "stargazers 列表拉取失败，降级用仓库元数据 stargazers_count 兜底：$(head -c 300 /tmp/stars.err | tr '\n' ' ')"
            MODE=count
          fi
          if [ "$MODE" = list ]; then
            if [ ! -s /tmp/stars.txt ]; then echo "No stars fetched"; exit 0; fi
            OLD_TOTAL=$(node -e "const fs=require('fs');try{const d=JSON.parse(fs.readFileSync('docs/star-history.json','utf8'));process.stdout.write(String(d[d.length-1]?.total??0))}catch{process.stdout.write('0')}")
            node scripts/update-star-history.mts /tmp/stars.txt
            # 星标总数只增不减；总数变小说明这次分页没拉全（限流、网络、中途失败），
            # 宁可这一次不提交，也不要把图画出一个向下的坑。
            NEW_TOTAL=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('docs/star-history.json','utf8'));process.stdout.write(String(d[d.length-1]?.total??0))")
            if [ "$NEW_TOTAL" -lt "$OLD_TOTAL" ]; then
              echo "::error::这次拉到的星标总数是 $NEW_TOTAL，比上次落盘的 $OLD_TOTAL 还少，可能是分页没拉全；已停止，不提交残缺数据。"
              exit 1
            fi
          else
            # 兜底路径：元数据总数追加为当日一条。同一天重复跑则原地更新当日总数。
            # 同样遵守"只增不减"：元数据总数若小于上次落盘数，拒绝提交（红）。
            STAR_COUNT=$(gh api "repos/$REPO" --jq .stargazers_count)
            echo "stargazers_count=$STAR_COUNT（兜底模式）"
            STAR_COUNT="$STAR_COUNT" node -e "
              const fs = require('fs');
              const p = 'docs/star-history.json';
              let d = [];
              try { d = JSON.parse(fs.readFileSync(p, 'utf8')); } catch {}
              if (!Array.isArray(d)) d = [];
              const today = new Date().toISOString().slice(0, 10);
              const count = Number(process.env.STAR_COUNT);
              if (!Number.isFinite(count)) { console.error('::error::stargazers_count 不是数字'); process.exit(1); }
              const last = d[d.length - 1];
              const lastTotal = Number(last?.total ?? 0);
              if (count < lastTotal) {
                console.error('::error::仓库元数据 stargazers_count=' + count + ' 小于上次落盘总数 ' + lastTotal + '，拒绝提交残缺数据。');
                process.exit(1);
              }
              if (last && last.date === today) {
                const prevTotal = Number(d[d.length - 2]?.total ?? 0);
                last.total = count;
                last.daily = Math.max(0, count - prevTotal);
                console.log('更新当日：', today, 'total', count);
              } else {
                d.push({ date: today, total: count, daily: Math.max(0, count - lastTotal) });
                console.log('追加当日：', today, 'total', count);
              }
              fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n');
            "
          fi
          node scripts/generate-star-history-svg.mts
      - name: Bump README cache stamp
        run: |
          node -e "
            const fs = require('fs');
            const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
            for (const f of ['README.md','docs/README.en.md']) {
              let s = fs.readFileSync(f,'utf8');
              s = s.replace(/(star-history-(?:dark|light)[.]svg[?]v=)[0-9]+/g, (m, p1) => p1 + stamp);
              fs.writeFileSync(f, s);
            }
            console.log('cache stamp:', stamp);
          "
      - name: Commit if changed
        run: |
          if git diff --quiet docs/star-history.json docs/star-history-dark.svg docs/star-history-light.svg README.md docs/README.en.md; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/star-history.json docs/star-history-dark.svg docs/star-history-light.svg README.md docs/README.en.md
          git commit -m "每日更新 Star History：追加拉取到的星标数据并重新生成手绘双主题图表"
          # 从 checkout 到 push 之间 main 可能又被别的提交推前了，直接 push 会被拒（! [rejected] main -> main (fetch first)）。
          # 先同步远端再推；合并冲突或并发撞车时重试三次，仍失败就红，下一次定时任务会接着补。
          for i in 1 2 3; do
            if git fetch origin main && git merge --no-edit origin/main && git push origin main; then
              exit 0
            fi
            git merge --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::同步远端后仍推不上去，已重试 3 次。"
          exit 1
